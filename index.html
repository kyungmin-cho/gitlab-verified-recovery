<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Verified Recovery · Evidence ledger</title>
<style>
:root{
  --bg:#efeeeb;--ink:#1c1d1f;--text:#3d4045;--muted:#696c72;--faint:#909297;--rule:#dcdad4;--rule2:#e6e4df;--panel:#fbfaf7;
  --z-head:#f7f3eb;--z-list:#efeeeb;--z-panel:#e5e3de;--z-hover:#f5f4f1;
  --pass:#1f6b3b;--pass-bg:#e9f2ec;--block:#b3261e;--block-bg:#fbeeec;
  --serif:"IBM Plex Serif","Source Serif Pro",Georgia,serif;
  --sans:"IBM Plex Sans",Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--z-head);color:var(--text);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
.nolink{color:var(--muted)}
.zone{width:100%}
.z-head{background:var(--z-head);border-bottom:1px solid #e6e1d6}
.z-list{background:var(--z-list);padding:30px 0 44px}
.z-notes{background:var(--z-head);border-top:1px solid #e6e1d6;padding:28px 0 52px}
.page{width:1280px;margin:0 auto;padding:0 80px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}

/* L1 */
.l1{padding:52px 0 40px}
.kicker{font:600 11px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.verdict{font:500 35px/1.24 var(--serif);color:var(--ink);letter-spacing:-.5px;margin:16px 0 0;max-width:1080px;text-wrap:balance}
.verdict .ok{color:var(--pass)}
.verdict .no{color:var(--block)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;margin-top:40px}
.key .n{font:500 52px/1 var(--serif);color:var(--ink);letter-spacing:-1px}
.key .n small{font-size:24px;color:var(--faint);letter-spacing:0}
.key.ok .n{color:var(--pass)}
.key.no .n{color:var(--block)}
.key .t{font:600 14px/1.3 var(--sans);color:var(--ink);margin-top:10px}
.key .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.meta{margin-top:36px;font-size:12px;color:var(--muted);display:flex;gap:28px}
.meta b{font-weight:500;color:var(--text)}
.meta sup{line-height:0}

/* L2 */
.l2head{display:flex;align-items:baseline;gap:16px}
.l2head h2{font:600 11px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0}
.l2head .tools{margin-left:auto;display:flex;gap:4px}
.tbtn{font:500 12px var(--sans);color:var(--muted);background:none;border:0;padding:4px 8px;border-radius:4px;cursor:pointer}
.tbtn:hover{color:var(--ink);background:var(--rule2)}
.grid{display:grid;grid-template-columns:28px 56px minmax(0,1fr) 100px 248px 136px 104px;align-items:center;column-gap:12px}
.cols{margin-top:14px;padding:0 0 8px;font:600 10.5px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.cols .r{text-align:right}
.rec{border-top:1px solid var(--rule)}
.rec:last-of-type{border-bottom:1px solid var(--rule)}
.row{padding:16px 0;cursor:pointer}
.row:hover{background:var(--z-hover)}
.rec.open>.row{background:transparent}
.tog{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:4px}
.tog svg{width:14px;height:14px;transition:transform .15s}
.rec.open .tog svg{transform:rotate(90deg)}
.ref{font:500 12px var(--mono);color:var(--muted)}
.name{font:600 16px/1.3 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name a{text-decoration:none}
.name a:hover{text-decoration:underline}
.stamp{display:inline-block;font:700 11px/1 var(--sans);letter-spacing:1.6px;padding:5px 8px 4px;border:1.5px solid currentColor;border-radius:2px}
.stamp.PASS{color:var(--pass)}
.stamp.BLOCK,.stamp.FAIL,.stamp.INCOMPLETE{color:var(--block)}
.ctl{font-size:12.5px;color:var(--text);line-height:1.4}
.ctl .m{color:var(--muted)}
.rej{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.rej .real{color:var(--block);font-weight:600}
.rej .delib{color:var(--muted)}
.dur{text-align:right;font:500 15px/1.2 var(--serif);color:var(--ink)}
sup.fn{font:600 10px var(--sans);color:var(--muted);margin-left:1px}

/* L3 */
.l3{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:36px;padding:20px 24px 22px 28px;margin:0 0 18px 40px;background:var(--z-panel);border-radius:8px;
  --muted:#5f6268;--faint:#7e8086;--rule2:#d6d3cd}
.l3[hidden]{display:none}
.sub{font:600 10.5px/1 var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.chain{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:14px 62px minmax(0,1fr) auto;column-gap:12px;padding:9px 0;border-top:1px solid var(--rule2)}
.step:first-child{border-top:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);margin-top:6px}
.step.ok .dot{background:var(--pass)}
.step.bad .dot{background:var(--block)}
.when{font:12px/1.6 var(--mono);color:var(--muted)}
.cp{font-weight:600;color:var(--ink);font-size:13px}
.step.bad .cp{color:var(--block)}
.ev{color:var(--muted);font-size:12.5px;margin-top:1px}
.refs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:5px}
.res{font:600 10.5px/1.6 var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-align:right;padding-top:1px}
.res.ok{color:var(--pass)}
.res.bad{color:var(--block)}
aside .blk{margin-bottom:22px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;margin:0;font-size:12.5px;align-items:center}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.kv dd.nm{color:var(--faint);font-style:italic}
.path{font:12px var(--mono);color:var(--text);overflow-wrap:anywhere}
.same{color:var(--pass);font-size:12px}
table.scan{border-collapse:collapse;width:100%;font-size:12.5px}
table.scan th{font:600 10.5px/1 var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--faint);text-align:right;padding:0 0 7px 6px}
table.scan th:first-child{text-align:left;padding-left:0}
table.scan td{padding:5px 0 5px 6px;border-top:1px solid var(--rule2);text-align:right;font-variant-numeric:tabular-nums}
table.scan th:last-child{padding-right:22px}
table.scan td:first-child{text-align:left;padding-left:0;color:var(--text);white-space:nowrap}
table.scan td.z{color:var(--faint)}
table.scan td.hot{color:var(--block);font-weight:600}

/* chips */
.idref{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.idref .kind{color:var(--muted);font-size:12px}
.chip{font:500 12px/1 var(--mono);color:var(--ink);background:var(--panel);border:1px solid #d3d0c9;border-radius:4px;padding:3px 6px;cursor:copy;transition:background .12s,border-color .12s}
.chip:hover{background:#fff;border-color:#bdb9b0}
.lk:hover{background:rgba(255,255,255,.6)}
.chip.copied{background:var(--pass-bg);border-color:#b9d6c3;color:var(--pass)}
.lk{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;color:var(--faint);text-decoration:none}
.lk:hover{color:var(--ink);background:var(--rule2)}
.lk svg{width:12px;height:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:#fff;font:500 12.5px var(--sans);padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast code{font:12px var(--mono);color:#cfe9d8;margin-left:6px}

/* notes */
.notes{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:8px 48px;font-size:12px;color:var(--muted);line-height:1.55}
.notes p{margin:0}
.notes b{color:var(--text);font-weight:600}
.notes sup{font-weight:600;color:var(--text)}

@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff}
  .page{width:auto;padding:0}
  .zone,.l3{background:#fff!important;border:0!important;padding-top:0}
  .z-list,.z-notes{padding:12px 0 0}
  .l3{border-left:2px solid #ddd!important;border-radius:0;margin-left:20px}
  .l1{padding-top:0}
  .tools,.lk,.toast{display:none!important}
  .tog{visibility:hidden}
  .l3[hidden]{display:grid}
  .row:hover{background:none}
  .chip{background:none;border:0;padding:0;font-size:10.5px;text-align:left}
  .chip .s{display:none}
  .chip::after{content:attr(data-full);overflow-wrap:anywhere}
  .idref{white-space:normal}
  .l1{padding-bottom:24px}
  .verdict{font-size:26px;max-width:none}
  .keys{margin-top:22px;gap:24px}
  .key .n{font-size:36px}
  .meta{margin-top:18px}
  .grid{grid-template-columns:0 44px minmax(0,1fr) 72px 230px 84px 90px;column-gap:10px}
  .name{white-space:normal;font-size:14px}
  .row{padding:10px 0;break-after:avoid}
  .l3{grid-template-columns:minmax(0,1fr) 350px;gap:24px;padding:4px 0 18px 54px}
  table.scan td,table.scan th{padding-left:6px}
  table.scan td:last-child .chip::after{white-space:nowrap}
  .step,.kv,table.scan tr{break-inside:avoid}
  .notes{break-inside:avoid;margin-top:24px}
  a{text-decoration:none}
}
</style>
</head>
<body>
<header class="zone z-head"><div class="page">
  <section class="l1" aria-label="Verdict">
    <div class="kicker">Verified Recovery · Evidence ledger</div>
    <h1 class="verdict" id="verdict"></h1>
    <div class="keys" id="keys"></div>
    <div class="meta" id="meta"></div>
  </section>
</div></header>

<main class="zone z-list"><div class="page">
  <section aria-label="Recovery records">
    <div class="l2head"><h2>Recovery records</h2>
      <div class="tools"><button class="tbtn" id="ex" type="button">Expand all</button><button class="tbtn" id="co" type="button">Collapse all</button><button class="tbtn" id="pr" type="button">Print</button></div>
    </div>
    <div class="grid cols" aria-hidden="true"><span></span><span>Ref</span><span>Incident</span><span>Verdict</span><span>Roles · approval</span><span class="r">Stopped</span><span class="r">Incident → fix</span></div>
    <div id="records"></div>
  </section>
</div></main>

<footer class="zone z-notes"><div class="page">
  <div class="notes" id="notes" style="margin-top:0"></div>
</div></footer>

function ext(label, url, cls) {

}


const T = VR.totals, I = VR.incidents, NM = 'Not measured';
const RAWBY = Object.fromEntries(RAW_ROWS.map(r => [r.id, r]));
const svgEl = s => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstChild; };
const ICON_LINK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5L3 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* Short form: hex hashes keep the first 7 characters; long numeric ids keep the last 7 digits, because ids in one project share a prefix. */
function shortOf(v) {
  const s = String(v);

}
function idref(kind, value, url, showKind) {

key(h('span', {}, String(realStops), h('small', {}, ' + ' + T.boundary)), 'Bad changes stopped before merge',
  realStops + ' real (' + T.rejectedProposals + ' hanging test, ' + T.blockedMrs + ' High SAST block) + ' + T.boundary + ' deliberate boundary tests.³', 'no');
key(String(T.highCritical), 'High or Critical merged', 'SAST, Secret Detection and Dependency Scanning ran on every fix.');
const ev = T.snapshot ? T.snapshot.slice(0, 16).replace('T', ' ') + ' UTC' : NM;
document.getElementById('meta').append(
  h('span', {}, 'Scope ', h('b', {}, I[0].scope)), h('span', {}, 'Release authorized ', h('b', {}, String(T.releaseAuthorized)), h('sup', {}, '⁴')),
  h('span', {}, 'Latest evaluation ', h('b', {}, ev)), h('span', {}, 'Times in UTC'));

/* L3 helpers */
function chain(i) {
  const raw = RAWBY[i.id] || {};
  const steps = [];
  const add = (cls, time, cp, ev, refs, res) => steps.push({ cls, time, cp, ev, refs: (refs || []).filter(Boolean), res });
  const R = k => i.rejections.filter(x => x.stage === k);
  const t = iso => (iso ? VR.clock(iso).slice(0, 5) : null);
  add('', t(i.metrics.createdAt), 'Incident opened', i.title + '.', [ext('Issue #' + i.num, i.issueUrl)], ['', 'Opened']);
  if (i.historical) {
    const s = i.sessions[0];
    add('', null, 'Reproduce and fix in one session', 'One Duo session wrote both the test and the fix; role isolation was not enforced.¹', [idref('Session', s.id, s.url)], ['', 'Historical']);
  } else {
    R('reproduce').forEach(x => add('bad', null, 'Reproduce proposal rejected', x.detail, [idref('Session', x.url && x.url.split('/').pop(), x.url)], ['bad', 'Rejected']));
    const rs = i.reproAccepted;
    add('ok', null, 'Reproduce', 'Read-only session proposed the failing test; the controller pinned and committed it.', [idref('Session', rs.id, rs.url), idref('Test commit', i.testCommit), i.redPipelineUrl ? idref('Red pipeline', i.redPipelineId, i.redPipelineUrl) : null], ['ok', 'Accepted']);
    add('ok', null, 'Fix', 'A separate read-only session proposed the source fix.', [idref('Session', i.fix.id, i.fix.url)], ['', 'Proposed']);
  }
  R('scans').forEach(x => add('bad', null, x.title, x.detail, [idref('Pipeline', (x.url || '').split('/').pop(), x.url), ext(x.link2Label, x.url2)], ['bad', 'Blocked']));
  R('green').forEach(x => add('bad', null, x.title + '³', x.detail, [idref('Pipeline', (x.url || '').split('/').pop(), x.url), x.url2 ? idref('Job', x.url2.split('/').pop(), x.url2) : null], ['bad', 'Rejected']));
  add('ok', t(i.red.executed_at), 'Red run', 'Pinned test on the incident commit: ' + i.red.result + '.', [idref('Commit', i.red.source_sha), idref('Job', i.red.job_id, i.evidenceJob && i.evidenceJob.url)], i.red.result === 'fail' ? ['ok', 'Fails as expected'] : ['bad', 'No red']);
  add('ok', t(i.green.executed_at), 'Green run', 'Same test on the fix: ' + i.green.result + '; SHA-256 ' + (i.sameTest ? 'identical.' : 'differs.'), [idref('Commit', i.green.source_sha), idref('Pipeline', i.pipelineId, i.pipelineUrl)], i.green.result === 'pass' && i.sameTest ? ['ok', 'Pass'] : ['bad', 'Fail']);
  add('ok', t(raw.evidence && raw.evidence.scan && raw.evidence.scan.completed_at), 'Security scans', i.high + ' High, ' + i.critical + ' Critical, ' + i.medium + ' Medium. Medium does not block.', [], i.high + i.critical === 0 ? ['ok', 'Pass'] : ['bad', 'Block']);
  if (i.historical) add('', null, 'Approval', 'Not enforced in milestone 2.¹', [], ['', 'Not enforced']);

  const ol = h('ol', { class: 'chain' });

    h('div', {}, h('div', { class: 'cp' }, s.cp), h('div', { class: 'ev' }, s.ev), s.refs.length ? h('div', { class: 'refs' }, s.refs) : null),
    h('span', { class: 'res ' + s.res[0] }, s.res[1]))));
  return h('div', {}, h('div', { class: 'sub' }, 'Evidence chain'), ol);
}
function aside(i) {

    ['Fresh human clicks', ...val(m.humanTouches)], ['Owner approvals', ...val(m.approvals)], ['Credits', ...val(m.credits === NM ? null : m.credits)]]);

/* L2 */
const recs = document.getElementById('records');
I.forEach(i => {
  const id = 'l3-' + i.id;
  const rec = h('div', { class: 'rec', id: i.id });
  const tog = h('button', { type: 'button', class: 'tog', 'aria-expanded': 'false', 'aria-controls': id, 'aria-label': 'Show evidence for ' + i.title }, svgEl(ICON_CHEV));
  const real = i.rejections.filter(x => x.retry).length, delib = i.rejections.length - real;
  const stopped = real || delib
    ? [real ? h('span', { class: 'real' }, real + ' real') : null, real && delib ? h('span', { class: 'delib' }, ' + ') : null,
       delib ? h('span', { class: 'delib' }, delib + (real ? ' test' : ' boundary test') + (delib > 1 ? 's' : '')) : null, delib ? h('sup', { class: 'fn' }, '3') : null]
    : 'None';
  const row = h('div', { class: 'grid row' },
    tog, h('span', { class: 'ref' }, 'VR-' + i.num),
    h('div', { class: 'name' }, ext(i.title, i.issueUrl), i.historical ? h('sup', { class: 'fn' }, '1') : null),
    h('div', {}, h('span', { class: 'stamp ' + i.verdict }, i.verdict)),
    h('div', { class: 'ctl' }, i.historical
      ? [h('span', { class: 'm' }, 'Single session · approval not enforced'), h('sup', { class: 'fn' }, '1')]
      : ['Separate sessions', h('span', { class: 'm' }, ' · '), 'owner API approval', h('sup', { class: 'fn' }, '2')]),
    h('div', { class: 'rej', title: i.rejections.map(x => x.title).join('; ') || 'No rejected changes' }, stopped),
    h('div', { class: 'dur', title: i.metrics.seconds == null ? NM : i.metrics.seconds + ' seconds, incident created to verified fix' }, i.metrics.duration || NM));
  const l3 = h('div', { class: 'l3', id, hidden: true }, chain(i), aside(i));
  const set = open => { l3.hidden = !open; rec.classList.toggle('open', open); tog.setAttribute('aria-expanded', String(open)); };
  row.addEventListener('click', e => { if (e.target.closest('a,.chip')) return; set(l3.hidden); });
  rec._set = set;
  rec.append(row, l3);
  recs.append(rec);
});
const setAll = open => document.querySelectorAll('.rec').forEach(r => r._set(open));
document.getElementById('ex').onclick = () => setAll(true);
document.getElementById('co').onclick = () => setAll(false);
document.getElementById('pr').onclick = () => window.print();
window.addEventListener('beforeprint', () => setAll(true));
function fromHash() {
  const hsh = location.hash.slice(1);
  if (hsh === 'all') setAll(true);
  else if (hsh.startsWith('open=')) hsh.slice(5).split(',').forEach(id => { const r = document.getElementById(id); if (r && r._set) r._set(true); });
  else { const r = document.getElementById(hsh); if (r && r._set) r._set(true); }
}
fromHash(); window.addEventListener('hashchange', fromHash);

/* Notes */
const hist = I.find(i => i.historical), owner = I.find(i => !i.historical);
document.getElementById('notes').append(
  hist ? h('p', {}, h('sup', {}, '1 '), h('b', {}, 'Historical record. '), 'VR-' + hist.num + ' is a milestone 2 recovery. One Duo session wrote both the test and the fix, approval was not enforced, and human touches were not measured. Its PASS covers the red/green test and the scans only.') : null,
  owner ? h('p', {}, h('sup', {}, '2 '), h('b', {}, 'Owner API approval. '), owner.approval.label + '. It is not a protected job.') : null,
  h('p', {}, h('sup', {}, '3 '), h('b', {}, 'Deliberate boundary checks. '), 'The policy, CI and test edits were planted on purpose to prove the CI role boundary. Their pipelines failed as expected and nothing was merged.'),
  h('p', {}, h('sup', {}, '4 '), h('b', {}, 'Scope. '), 'Verdicts cover recovery CI only. Release authorized is false for every record; no deployment is claimed.'),
  h('p', {}, h('b', {}, 'Scan policy. '), 'High or Critical findings, and missing or failed required scans, block a record. Medium findings stay visible.'),
  h('p', {}, h('b', {}, 'Measurements. '), 'Pipeline job minutes are runner time, not billed cost. Credits: ' + NM.toLowerCase() + '; ' + I[0].metrics.creditReason.replace(/^./, c => c.toLowerCase())),
  h('p', {}, h('b', {}, 'Identifiers. '), 'Commits and hashes show their first 7 characters; pipeline, job and session numbers show their last 7 digits. Click any chip to copy the full value; the arrow opens it in GitLab.'));
